# Render blueprint — one file that stands the whole stack up.
#
# Why Render: the repo already has production Dockerfiles and a migrate-on-start
# story from docker-compose.prod.yml, and Render reads this file straight from
# the GitHub repo. No CLI to install and no credentials to hand around — you
# connect the repo in the dashboard and it builds what is written here.
#
# What this creates:
#   impactbridge-db   Postgres (free tier)
#   impactbridge-api  Express + Prisma, built from apps/api/Dockerfile
#   impactbridge-web  the built Vite app, served as a static site
#
# ── The one thing to understand ─────────────────────────────────────────────
#
# The web app calls the API at RELATIVE paths (`/api/...`) so that the refresh
# cookie is same-origin. That is deliberate and it is why the static site below
# carries a rewrite: the browser only ever talks to the web origin, and Render
# proxies `/api/*` through to the API service. Without that rewrite every
# request would be cross-origin and the auth cookie would be dropped.
#
# After the first deploy, seed the demo data ONCE from the API service's shell:
#   pnpm --filter @impactbridge/api db:seed
#   pnpm --filter @impactbridge/api db:seed:profiles
#   pnpm --filter @impactbridge/api exec tsx prisma/seedDonations.ts

# ── The database is referenced, NOT declared ────────────────────────────────
#
# There is deliberately no `databases:` block here.
#
# Render's free tier allows exactly ONE Postgres instance per workspace, and
# `impactbridge-db` already exists and holds the seeded demo data. With the
# database declared here, a sync tried to CREATE a second one — Render
# generated the suffixed name `impactbridge-db-v3dn` to avoid the collision and
# then failed against the free-tier quota.
#
# Removing the declaration is the fix, and it is safe: syncing a Blueprint
# never deletes an existing resource, even one that has been dropped from the
# file. The database is simply no longer MANAGED by this Blueprint — it keeps
# its data, its connection string and its dashboard entry untouched.
#
# The API still binds to it through `fromDatabase` below. That works precisely
# because a Blueprint may reference a resource it does not define, provided the
# resource exists in the same workspace — which this one does.
#
# If the database is ever recreated from scratch, either restore this block or
# create it in the dashboard first and leave this reference as it is.

services:
  # ── API ───────────────────────────────────────────────────────────────────
  - type: web
    name: impactbridge-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # NO `dockerCommand` here, deliberately. Do not reintroduce one.
    #
    # It used to read:
    #
    #   dockerCommand: sh -c "./node_modules/.bin/prisma migrate deploy … && node dist/index.js"
    #
    # and it failed every deploy with exit 127:
    #
    #   sh: ./node_modules/.bin/prisma migrate deploy … && node dist/index.js: not found
    #
    # Render runs this value through a shell already, so the explicit `sh -c`
    # wrapped it twice — the inner command reached the shell as ONE quoted
    # token, which it then tried to execute as a single program name. The error
    # names the whole string, which reads like a missing `dist/index.js` and is
    # really a quoting bug; the image was correct the entire time.
    #
    # The image's own CMD now runs apps/api/docker-start.sh, which applies
    # migrations and then execs the server. Migrations still run at START, not
    # at build — the database only exists at runtime, so a deploy can never
    # serve traffic against a schema the code does not expect.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Binds to the EXISTING impactbridge-db (see the note above the services
      # block). `connectionString` resolves to the internal URL when the service
      # and the database share a region, so this traffic never leaves Render.
      - key: DATABASE_URL
        fromDatabase:
          name: impactbridge-db
          property: connectionString
      # Both generated by Render and never seen by anyone, which is the point.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # The web origin. Requests arrive proxied from the static site, so this is
      # the URL a browser actually shows.
      - key: CORS_ORIGIN
        fromService:
          name: impactbridge-web
          type: web
          property: host
      - key: WEB_APP_URL
        fromService:
          name: impactbridge-web
          type: web
          property: host
      - key: API_PUBLIC_URL
        fromService:
          name: impactbridge-api
          type: web
          property: host
      - key: CURRENCY
        value: inr
      # ⚠️  `sync: false`, NOT a hardcoded value. Do not put one back. ⚠️
      #
      # This used to read `value: mock`, and that silently broke live payments.
      #
      # Razorpay TEST mode was enabled by setting PAYMENT_PROVIDER=razorpay in
      # the dashboard. It worked — and then the next commit that touched this
      # file re-synced the Blueprint, which overwrote the dashboard value back
      # to `mock`. Render is explicit that dashboard changes conflicting with
      # the Blueprint are overwritten on the next sync, so a hardcoded value
      # here means the Blueprint wins every time and the gateway silently
      # reverts. The logs show exactly that:
      #
      #   17:40  💳 Payments: Razorpay TEST mode …
      #   17:41  🧪 Payments are using the MOCK provider   <- after a sync
      #
      # `sync: false` hands ownership to the dashboard, the same treatment the
      # Razorpay keys already get. Leaving it UNSET is also safe: the app falls
      # back to Razorpay when credentials are present and the mock when they
      # are not, so a deploy with no keys still works end to end.
      - key: PAYMENT_PROVIDER
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Optional. Without these the AI endpoints answer 503 and the UI hides
      # every AI control, which is a working state, not a broken one.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ── Web ───────────────────────────────────────────────────────────────────
  - type: web
    name: impactbridge-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @impactbridge/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      # ⚠️  LOAD-BEARING. Without this the static build fails on Render. ⚠️
      #
      # `packageManager` pins pnpm 11.20.0, and pnpm 11 requires the `node:sqlite`
      # built-in, which only exists from Node 22. The API never hit this because
      # its Dockerfile pins `node:24-alpine`, and CI never hit it because the
      # workflow pins Node 24 — this static site was the one place left running
      # on whatever Node the platform defaults to, which is older. pnpm then
      # crashed before Vite was ever invoked:
      #
      #   Error [ERR_UNKNOWN_BUILTIN_MODULE]: No such built-in module: node:sqlite
      #       at …/pnpm/11.20.0/dist/pnpm.mjs
      #
      # Reproduced on Node 18 and 20 (both fail) and 22 and 24 (both pass).
      # 24 to match the API's runtime, so both services run the same major.
      - key: NODE_VERSION
        value: "24"
    # SPA: every unknown path is a client route, not a 404 — but /api must be
    # proxied FIRST or the rewrite below would swallow it.
    routes:
      # ⚠️  THE ONE VALUE THAT CANNOT BE DERIVED ⚠️
      #
      # A static site's rewrite destination must be a LITERAL URL. Render's
      # Blueprint spec has no service interpolation in `routes` — `fromService`
      # works in `envVars`, which is how DATABASE_URL and CORS_ORIGIN resolve
      # themselves, but there is no equivalent here. So this host has to be
      # written out, and it has to match the API service exactly.
      #
      # The `-cje5` suffix is not a typo. onrender.com subdomains are globally
      # unique and `impactbridge-api.onrender.com` was already taken, so Render
      # appended one at creation. The value below was confirmed live
      # (GET /api/health -> 200) before being committed.
      #
      # If the API service is ever recreated it may get a different suffix, and
      # this line must be updated to match. Getting it wrong FAILS QUIETLY in
      # the worst way: the site loads, looks perfect, and every API call 404s —
      # so pages render their empty states and it reads as "the database is
      # broken" rather than as a routing typo. Verify after any change with:
      #
      #     curl -s -o /dev/null -w '%{http_code}' https://<web-host>/api/health
      #
      # 200 means the rewrite is right. 404 means this line is wrong.
      - type: rewrite
        source: /api/*
        destination: https://impactbridge-api-cje5.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # The media library is content-addressed by the build; everything else is
      # an index that must not be cached across deploys.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

      # ── Security headers for the DOCUMENT origin ──────────────────────────
      #
      # The API sets its own (see apps/api/src/middleware/securityHeaders.ts),
      # but those only ride on JSON responses. Everything that actually protects
      # the *page* — the CSP, framing, referrer policy — has to be set by
      # whoever serves index.html, which is this static site.
      #
      # ⚠️  THE SCRIPT HASH BELOW IS TIED TO EXACT BYTES ⚠️
      #
      # index.html carries one inline <script>: the pre-paint theme switch that
      # stops dark-mode users seeing a white flash on every cold load. Rather
      # than open the policy with 'unsafe-inline' — which would forfeit most of
      # what a CSP is for — it is allowed by SHA-256 hash.
      #
      # If you edit that script by so much as a space, the hash stops matching,
      # the browser blocks it, and dark mode flashes white on first paint. The
      # app still works, so nothing will fail loudly. Regenerate with:
      #
      #   pnpm --filter @impactbridge/web build
      #   node -e "const f=require('fs'),c=require('crypto');const h=f.readFileSync('apps/web/dist/index.html','utf8');const m=h.match(/<script(?![^>]*src=)[^>]*>([\s\S]*?)<\/script>/);console.log('sha256-'+c.createHash('sha256').update(m[1].replace(/\r\n/g,'\n')).digest('base64'))"
      #
      # The `.replace(/\r\n/g,'\n')` is not tidying — it is the whole reason
      # this hash is portable. A Windows checkout can leave CRLF in the file,
      # and hashing those raw bytes gives a DIFFERENT digest that would then be
      # wrong everywhere else. Browsers never see the CRs: the HTML parser
      # normalises newlines to LF while tokenising, so CSP always hashes the LF
      # form. Normalising here matches what the browser does, and it is also
      # what Render checks out, since .gitattributes pins `* text=auto eol=lf`.
      #
      # Every source below was derived from what the app actually loads and then
      # verified against a real build served with this exact header — not
      # guessed. `font-src data:` in particular is not optional: Fontsource
      # inlines small font subsets as data: URIs inside its CSS, and without it
      # the display face silently fails to load.
      # `images.unsplash.com` is in img-src because the seeded organisation
      # cover images are hosted there — every one of the 8 demo orgs stores an
      # unsplash URL in `coverUrl`. Without it the CSP blocked all of them and
      # the site rendered broken-image icons on the browse grid, the story
      # cards and the donation history, which reads as missing data rather than
      # as a blocked request. `img-src` is the safe directive to widen: an
      # image cannot execute. Replacing that seed data with the committed
      # same-origin media under /media would let this be removed again.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-n42NM3voYxt7Vym+bFHxtD+BAS4N4XkB16ABVesRAaw=' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://images.unsplash.com https://*.razorpay.com; font-src 'self' data:; connect-src 'self' https://*.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com; worker-src 'self' blob:"

      # `style-src 'unsafe-inline'` above is deliberate and unavoidable: React
      # renders `style={{...}}` props as inline style attributes and GSAP writes
      # transforms the same way, so removing it would break every animation on
      # the landing page. It is also the least dangerous of the inline
      # allowances — it cannot execute script.

      - path: /*
        name: X-Frame-Options
        value: DENY

      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      # Cross-origin links leak nothing but the origin; same-origin navigation
      # keeps the full path, which the app itself relies on for return-to URLs.
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()

      # Two years with preload-eligible settings. Render serves this site over
      # https only, so there is no http listener this can lock anyone out of.
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
