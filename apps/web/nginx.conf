server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # ── A note on why these headers are repeated per location ────────────────
    #
    # nginx's `add_header` does NOT merge: a location block that declares any
    # `add_header` discards every header inherited from the server block. And
    # `try_files … /index.html` performs an INTERNAL redirect into the
    # `= /index.html` location, so a request for `/` ends up governed by that
    # block. Declaring the security headers once at server level therefore
    # silently dropped them from every HTML response — which is exactly what
    # the container test showed.
    #
    # Repeating them is the honest fix. `always` makes them apply to error
    # responses too, not just 2xx.

    # Hashed asset filenames change whenever content changes, so they can be
    # cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html must NOT be cached, or a browser keeps loading the old app
    # shell and requesting asset filenames that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback: React Router owns the URL space, so any unmatched path has
    # to return index.html rather than a 404 — otherwise refreshing on
    # /grants/some-slug breaks.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
